name: Bug Report
description: Report a bug or unexpected behavior in MalFrame
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug!
        Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Go to MIA Dashboard
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: dashboard
    attributes:
      label: Affected Dashboard / Page
      options:
        - MIA Dashboard (/mia)
        - MRE Dashboard (/mre)
        - Tools (/tools)
        - Settings (/settings)
        - Home (/)
        - Multiple / All
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser + Version
      placeholder: "Chrome 124, Firefox 125, Edge 124..."
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Windows 11, macOS 14, Ubuntu 22.04..."
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console Errors (if any)
      description: Open DevTools (F12) → Console tab and paste any errors.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, export files (JSON), or anything else that might help.
