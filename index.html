<!doctype html>
<html lang="en">
<head>
<script>
  // Apply saved theme immediately to prevent flash
  (function(){
    try {
      var theme = localStorage.getItem('cyber-analyst-theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.add('light');
      }
    } catch(e) {
      document.documentElement.classList.add('light');
    }
  })();
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Malware Analyst Dashboard</title>
<meta name="description" content="Malware Analyst Dashboard for incident analysis and reverse engineering." />

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.svg" />

<!-- Preconnect to external resources for faster loading -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
<link rel="dns-prefetch" href="https://github.com" />

<!-- Fonts loaded via stylesheet below - no preload needed (URLs change per version) -->

<!-- Font stylesheet with display=swap for no FOIT -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" />

<!-- Vite will inject proper modulepreload tags during build -->
<!-- Critical CSS inlined for faster First Contentful Paint -->
<link rel="stylesheet" href="/critical.css" />

</head>
<body>
<div id="root" class="app-loading">
  <div class="logo"></div>
  <div class="text">Initializing</div>
  <div class="bars">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</div>
<script type="module" src="/src/main.tsx"></script>
<script>
  // Fast loading cleanup - React will mount and trigger this
  window.__hideLoading = () => {
    const r = document.getElementById('root');
    if (r) {
      r.classList.remove('app-loading');
      r.innerHTML = '';
    }
  };
</script>
</body>
</html>
